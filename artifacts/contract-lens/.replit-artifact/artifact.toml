kind = "web"
previewPath = "/"
title = "ContractLens"
description = "An intelligent API reliability workspace that monitors endpoint health, validates API contracts, explains failures with AI, and helps engineering teams ship dependable services."
version = "1.0.0"
id = "artifacts/contract-lens"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21271

[services.development]
run = "pnpm --filter @workspace/contract-lens run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/contract-lens", "run", "build" ]
serve = "static"
publicDir = "artifacts/contract-lens/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21271"
BASE_PATH = "/"
